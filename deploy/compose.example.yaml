# Example Docker Compose service for rei3 (spec §18.1). No secrets here:
# every secret is a Docker secret whose file lives outside both repositories.
#
# Build the image first, from the repository root:
#   docker build -f deploy/Dockerfile -t octosprout-server:latest .
services:
  octosprout:
    image: octosprout-server:latest
    container_name: octosprout
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OCTOSPROUT_REMOTE_URL: git@github.com:bfarkas/octosprout-private.git
      OCTOSPROUT_DEPLOY_KEY_FILE: /run/secrets/deploy_key
      OCTOSPROUT_SETUP_TOKEN_FILE: /run/secrets/setup_token
      OCTOSPROUT_APPROVAL_KEY_FILE: /run/secrets/approval_signing_key
      # Optional: the health panel's CI status.
      # OCTOSPROUT_GITHUB_TOKEN_FILE: /run/secrets/github_token
      # Passkeys are bound to these. Changing either invalidates every registered passkey.
      OCTOSPROUT_RP_ID: octosprout.de
      OCTOSPROUT_ORIGIN: https://app.octosprout.de
      # Caddy reaches the container from the Docker bridge network; trust
      # X-Forwarded-For from there and nowhere else.
      OCTOSPROUT_TRUST_PROXY: 172.16.0.0/12
    volumes:
      - octosprout-repo:/var/lib/octosprout/repo
      - octosprout-state:/var/lib/octosprout/state
    secrets:
      - deploy_key              # SSH deploy key, write access to octosprout-private only
      - setup_token             # registers passkeys at /setup
      - approval_signing_key    # Ed25519, signs approvals (spec §9.4)
      # - github_token          # read-only, Actions on octosprout-private

volumes:
  octosprout-repo:
  octosprout-state:

secrets:
  deploy_key:
    file: /etc/octosprout/secrets/deploy_key
  setup_token:
    file: /etc/octosprout/secrets/setup_token
  approval_signing_key:
    file: /etc/octosprout/secrets/approval_signing_key
  # github_token:
  #   file: /etc/octosprout/secrets/github_token
